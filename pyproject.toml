# yaml-language-server: $schema=https://json.schemastore.org/pyproject.json
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bills-sql-lineage"
version = "0.0.6"
description = "Personal SQL lineage generator."
authors = [{name = "billwallis"}]
maintainers = [{name = "billwallis"}]
readme = "README.md"
urls.Homepage = "https://github.com/billwallis/bills-sql-lineage"
urls.Repository = "https://github.com/billwallis/bills-sql-lineage"
urls.Issues = "https://github.com/billwallis/bills-sql-lineage/issues"
urls.Documentation = "https://github.com/billwallis/bills-sql-lineage/blob/main/README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "arguably>=1.3.0",
    # TODO: The parser improves in v28+ so that the current approch of
    #       walking CTEs finds _all_ downstream CTEs, not just the immediate
    #       downstream CTEs. To increase the version, the CTE walking first
    #       needs to be updated.
    "sqlglot[c]>=27.0.0,<28.0.0",
]

[project.scripts]
lineage = 'sql_lineage.__main__:app'

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
]
test = [
    "covdefaults>=2.3.0",
    "coverage>=7.16.0",
    "pytest>=9.1.1",
]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.coverage]
run.source = ["src", "tests"]
run.plugins = ["covdefaults"]  # https://youtu.be/70T6OxKwxm0
report.fail_under = 100
report.exclude_lines = [
    "@pytest.mark.skip",
    "@pytest.mark.xfail",
]


[tool.poe]
verbosity = -1
envfile.optional = ".env"

[tool.poe.tasks]
install.shell = """
    pip install --editable . --group dev --group test
    pre-commit install --install-hooks
"""
test.shell = """
    coverage erase
    coverage run -m pytest -vvv
    coverage xml --quiet
    coverage report --no-skip-covered --include 'tests/*' --fail-under 100
    coverage report --no-skip-covered --include 'src/*'
"""

[tool.poe.tasks.lint]
control.expr = "sys.platform"

[[tool.poe.tasks.lint.switch]]
case = "win32"
shell = """
    echo '=== pre-commit checks ==='
    SKIP=identity pre-commit run --all-files --hook-stage pre-commit
    echo '=== pre-push checks ==='
    SKIP=identity pre-commit run --all-files --hook-stage pre-push
"""

[[tool.poe.tasks.lint.switch]]
shell = """
    echo '\\033[0;34mpre-commit checks\\033[0m'
    SKIP=identity pre-commit run --all-files --hook-stage pre-commit
    echo '\\033[0;34mpre-push checks\\033[0m'
    SKIP=identity pre-commit run --all-files --hook-stage pre-push
"""
